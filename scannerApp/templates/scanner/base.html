 {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                GS Petrol Pump
            </h1>

            <ul class="flex gap-6 font-medium">
                <li>
                    <a href="{% url 'home' %}" class="hover:text-yellow-300 transition">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{% url 'generateqr' %}" class="hover:text-yellow-300 transition">
                        Generate QR
                    </a>
                </li>

                <li>
                    <a href="{% url 'scanqr' %}" class="hover:text-yellow-300 transition">
                        Scan QR
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Main Heading -->
    <div class="text-center py-10">
        <h1 class="text-4xl font-bold text-gray-800">
            GS Petrol Pump Payment System
        </h1>

        <p class="text-gray-600 mt-3">
            Fast • Secure • Contactless QR Payments
        </p>
    </div>

    <!-- Content -->
    <div class="max-w-6xl mx-auto px-4">
        {% block content %}
        {% endblock content %}
    </div>

</body>
</html>
