 {% extends "scanner/base.html" %}

{% block title %}
Generate QR
{% endblock title %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="bg-white shadow-lg rounded-xl p-8">

        <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">
            Generate QR Code
        </h2>

         <form action="{% url 'generateqr'  %}" method="post" class="space-y-7">
            {% csrf_token %}

            <!-- Mobile Number -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Mobile Number
                </label>

                <input
                    type="text"
                    name="mobile_number"
                    placeholder="Enter 10-digit mobile number"
                    required
                    pattern="\d{10}"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <!-- QR Data -->
            <div class="my-2">
                <label class="block text-gray-700 font-semibold mb-">
                    QR Content
                </label>

                <input
                    name="qr_data"
                    type="text"
                    placeholder="Enter text, payment details, UPI ID, or any data for QR generation"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3  resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full my-6 bg-blue-700 text-white py-3 rounded-lg font-semibold text-lg hover:bg-blue-800 transition duration-300"
            >
                Generate QR Code
            </button>

        </form>
        <!-- img of qr code -->
       <div>
        {% if qr_image_url %}
        <h2>Your QR Code:</h2>
        <img src="{{ qr_image_url }}" alt="Generated QR code ">
        <br>
        <a href="{{ qr_image_url }}" download >Save QR</a>
        {% endif %}
       </div>
    </div>

</div>

{% endblock content %}
