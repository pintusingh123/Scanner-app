{% extends "scanner/base.html" %} {% block title %} Scan QR {% endblock title %}
{% block content %}

<div class="max-w-xl mx-auto">
  <div class="bg-white shadow-lg rounded-xl p-8">
    <h2 class="text-3xl font-bold text-center text-green-700 mb-6">
      Scan QR Code
    </h2>

    <form
      action="{% url 'scanqr'  %}"
      method="post"
      enctype="multipart/form-data"
      class="space-y-6"
    >
      {% csrf_token %}

      <!-- Mobile Number -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">
          Mobile Number
        </label>

        <input
          type="text"
          name="mobile_number"
          placeholder="Enter 10-digit mobile number"
          required
          pattern="\d{10}"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
        />
      </div>

      <!-- QR Image Upload -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">
          Upload QR Image
        </label>

        <div
          class="border-2 border-dashed border-green-300 rounded-xl p-6 bg-green-50"
        >
          <input
            type="file"
            name="qr_image"
            id="qr-input"
            accept="image/*"
            required
            class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold text-lg shadow-md hover:bg-green-700 transition duration-300"
      >
        Scan QR Code
      </button>
    </form>
    <h2>{{result}}</h2>
  </div>
</div>

{% endblock content %}
